name: Build and Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt update
          # Ubuntu 24.04 (ubuntu-latest) does not ship libtensorflow-lite-dev.
          # Skip examples/client/face_detect; enable it locally on Ubuntu 26.04+.
          sudo apt install -y cmake build-essential libopencv-dev

      - name: Configure CMake
        run: cmake -B build -DENABLE_FACE_DETECTION=OFF -DBUILD_TESTING=ON

      - name: Build project
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate install package
        run: cmake --install build --prefix "${{ runner.temp }}/uvap-install"
